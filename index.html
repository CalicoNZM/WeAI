<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AtmosphericWeather (A-sphereWeather)</title>
    <!-- Inter Font for heavy Brutalist typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* =========================================
           1. BASE THEMES (5 THEMES)
           ========================================= */
        :root {
            /* Shared Bubble Physics / Aero Glass Core */
            --glass-bg: rgba(255, 255, 255, 0.35);
            --glass-border: rgba(255, 255, 255, 0.7);
            --glass-shadow: 0 24px 48px rgba(0, 0, 0, 0.15);
            --glass-inset: inset 0 2px 10px rgba(255, 255, 255, 0.5);
            --bubble-highlight: inset 0px 15px 25px -10px rgba(255, 255, 255, 1);
            --bubble-lowlight: inset 0px -10px 20px -10px rgba(0, 0, 0, 0.05);
            --text-glow: 0 4px 15px rgba(255, 255, 255, 0.9);
            --widget-hover: rgba(255, 255, 255, 0.5);
            --error-color: #ff3333;
        }

        /* 1. Aero Sky (Default Day) */
        :root[data-theme="aero"] {
            --bg-grad-1: #74ebd5; --bg-grad-2: #9face6;
            --text-main: #03045e; --text-muted: #4a5568;
            --accent-cyan: #00b4d8; --accent-alt: #52b788;
        }

        /* 2. Astro Night (Deep Space) */
        :root[data-theme="astro"] {
            --bg-grad-1: #020024; --bg-grad-2: #090979;
            --glass-bg: rgba(10, 20, 60, 0.45); --glass-border: rgba(0, 180, 216, 0.4);
            --glass-shadow: 0 24px 48px rgba(0, 0, 0, 0.7); --glass-inset: inset 0 2px 10px rgba(0, 180, 216, 0.2);
            --bubble-highlight: inset 0px 15px 25px -10px rgba(0, 240, 255, 0.4); --bubble-lowlight: inset 0px -10px 20px -10px rgba(0, 0, 0, 0.4);
            --text-main: #ffffff; --text-muted: #94a3b8; --text-glow: 0 4px 15px rgba(0, 240, 255, 0.6);
            --accent-cyan: #00f0ff; --accent-alt: #38f59d; --widget-hover: rgba(10, 30, 80, 0.6);
        }

        /* 3. Solarpunk (Eco Green) */
        :root[data-theme="solar"] {
            --bg-grad-1: #a8e063; --bg-grad-2: #56ab2f;
            --text-main: #004d00; --text-muted: #2d6a4f;
            --accent-cyan: #d4d700; --accent-alt: #00b4d8;
            --glass-bg: rgba(255, 255, 255, 0.25);
        }

        /* 4. Sunset Vapor (Pink/Purple) */
        :root[data-theme="vapor"] {
            --bg-grad-1: #ff9a9e; --bg-grad-2: #fecfef;
            --glass-bg: rgba(255, 230, 240, 0.4); --glass-border: rgba(255, 255, 255, 0.8);
            --text-main: #4a00e0; --text-muted: #8e2de2;
            --accent-cyan: #ff0844; --accent-alt: #ffb199;
        }

        /* 5. Brutal Mono (Concrete Grey) */
        :root[data-theme="bruto"] {
            --bg-grad-1: #e0e0e0; --bg-grad-2: #bdc3c7;
            --glass-bg: rgba(200, 200, 200, 0.3); --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #2c3e50; --text-muted: #7f8c8d;
            --accent-cyan: #000000; --accent-alt: #333333;
        }

        /* Dynamic Biome Tinting (Applied to body to override root inside UI) */
        body.biome-rainforest { --glass-bg: rgba(40, 200, 100, 0.25); }
        body.biome-desert { --glass-bg: rgba(255, 180, 50, 0.25); }
        body.biome-tundra { --glass-bg: rgba(200, 240, 255, 0.25); }

        /* =========================================
           2. RESET & FOUNDATIONS
           ========================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background: #000; /* Fallback for canvas */
            transition: color 0.5s ease;
        }
        input { user-select: auto; }

        /* Procedural Canvas Background */
        #bgCanvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; pointer-events: none;
        }

        /* =========================================
           3. UI COMPONENTS & CONTROLS
           ========================================= */
        .app-container {
            max-width: 1200px; margin: 0 auto; padding: 20px;
            display: flex; flex-direction: column; gap: 20px; position: relative; z-index: 10;
        }

        /* Header Bar */
        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 15px; padding: 10px;
        }

        .bruto-title {
            font-weight: 900; font-size: 2.2rem; letter-spacing: -1.5px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--text-main));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: var(--text-glow); display: flex; align-items: center; gap: 10px;
        }

        .search-wrapper { position: relative; flex-grow: 1; max-width: 400px; z-index: 50; }
        .search-input {
            width: 100%; padding: 16px 24px 16px 50px; border-radius: 30px;
            border: 1px solid var(--glass-border); background: var(--glass-bg);
            color: var(--text-main); font-size: 1.1rem; font-weight: 600;
            backdrop-filter: blur(16px); box-shadow: var(--glass-inset), var(--bubble-highlight);
            outline: none; transition: all 0.3s ease;
        }
        .search-input::placeholder { color: var(--text-muted); }
        .search-input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 20px var(--accent-cyan), var(--glass-inset); }
        .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--accent-cyan); }

        .autocomplete-dropdown {
            position: absolute; top: calc(100% + 10px); left: 0; width: 100%;
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            display: none; flex-direction: column; gap: 5px; padding: 10px; box-shadow: var(--glass-shadow);
        }
        .autocomplete-item { padding: 12px 20px; border-radius: 15px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .autocomplete-item:hover { background: var(--accent-cyan); color: #fff; }

        /* Toolbar: Presets & Themes & Immersive Toggles */
        .toolbar {
            display: flex; gap: 15px; flex-wrap: wrap; align-items: center;
            background: var(--glass-bg); backdrop-filter: blur(16px);
            padding: 15px 24px; border-radius: 30px; border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow), var(--glass-inset);
        }

        .toolbar-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-right: 2px solid rgba(0,0,0,0.1); padding-right: 15px; }
        :root[data-theme="astro"] .toolbar-group { border-right-color: rgba(255,255,255,0.1); }
        .toolbar-group:last-child { border-right: none; padding-right: 0; }
        .toolbar-label { font-weight: 800; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; width: 100%; margin-bottom: 4px; }

        .glossy-btn {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 30px;
            padding: 10px 18px; color: var(--text-main); font-weight: 800; cursor: pointer;
            box-shadow: var(--glass-inset); display: inline-flex; align-items: center; gap: 8px;
            transition: all 0.3s; font-size: 0.9rem;
        }
        .glossy-btn:hover { background: var(--widget-hover); transform: translateY(-2px); }
        
        .toggle-btn.active { background: var(--accent-cyan); color: #fff; box-shadow: 0 0 15px var(--accent-cyan); border-color: transparent; }
        select.glossy-btn { appearance: none; padding-right: 30px; cursor: pointer; outline: none; }

        /* =========================================
           4. DRAGGABLE GRID & WIDGETS
           ========================================= */
        .widget-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; position: relative; }
        .widget {
            background: var(--glass-bg); backdrop-filter: blur(24px); border: 1px solid var(--glass-border);
            border-radius: 40px; box-shadow: var(--glass-shadow), var(--glass-inset), var(--bubble-highlight), var(--bubble-lowlight);
            padding: 24px; display: flex; flex-direction: column; cursor: grab;
            transition: transform 0.2s, background 0.3s, border-color 0.3s; overflow: hidden;
        }
        .widget:active { cursor: grabbing; }
        .widget.dragging { opacity: 0.8; transform: scale(1.02) translateY(-10px); z-index: 100; box-shadow: 0 30px 60px rgba(0,0,0,0.3), var(--bubble-highlight); }
        .widget.drag-over { border-color: var(--accent-cyan); background: var(--widget-hover); }

        .w-hero { grid-column: span 12; flex-direction: row; align-items: center; justify-content: space-between; padding: 40px; border-radius: 60px; min-height: 250px; }
        .w-hourly { grid-column: span 12; }
        .w-daily { grid-column: span 4; }
        .w-details { grid-column: span 8; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .w-sun { grid-column: span 4; }

        @media (max-width: 1024px) {
            .w-daily { grid-column: span 6; } .w-sun { grid-column: span 6; } .w-details { grid-column: span 12; }
        }
        @media (max-width: 768px) {
            .w-hero { flex-direction: column; text-align: center; gap: 20px; padding: 30px 20px; border-radius: 40px;}
            .w-daily, .w-sun, .w-details { grid-column: span 12; } .w-details { grid-template-columns: 1fr; }
        }

        /* Widget Interiors */
        .w-title { font-size: 1.1rem; font-weight: 800; color: var(--text-muted); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
        
        .hero-temp { font-size: 6rem; font-weight: 900; line-height: 1; background: linear-gradient(180deg, var(--text-main), var(--accent-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: var(--text-glow); }
        .hero-city { font-size: 2.5rem; font-weight: 800; margin-bottom: 5px; }
        .hero-cond { font-size: 1.5rem; font-weight: 600; color: var(--accent-cyan); display: flex; align-items: center; gap: 10px; }
        .hero-hl { font-size: 1.2rem; font-weight: 600; color: var(--text-muted); margin-top: 10px; }

        .hourly-scroll { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; cursor: grab; }
        .hourly-scroll::-webkit-scrollbar { display: none; }
        .hour-pill { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 80px; padding: 15px; border-radius: 25px; background: rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.2); }
        :root[data-theme="astro"] .hour-pill { background: rgba(255,255,255,0.05); }
        .hour-time { font-weight: 600; color: var(--text-muted); }
        .hour-temp { font-weight: 800; font-size: 1.2rem; }

        .daily-list { display: flex; flex-direction: column; gap: 12px; }
        .daily-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--glass-border); }
        .daily-item:last-child { border-bottom: none; }
        .daily-day { font-weight: 800; width: 50px; }
        .daily-bar { flex-grow: 1; height: 6px; background: rgba(0,0,0,0.1); border-radius: 3px; margin: 0 15px; position: relative; overflow: hidden; }
        :root[data-theme="astro"] .daily-bar { background: rgba(255,255,255,0.1); }
        .daily-bar-fill { position: absolute; height: 100%; background: var(--accent-cyan); border-radius: 3px; }
        .daily-temps { font-weight: 800; font-size: 0.9rem; min-width: 70px; text-align: right; }

        .detail-box { background: rgba(0,0,0,0.05); padding: 20px; border-radius: 30px; display: flex; align-items: center; gap: 15px; }
        :root[data-theme="astro"] .detail-box { background: rgba(255,255,255,0.05); }
        .detail-icon { color: var(--accent-cyan); }
        .detail-info h4 { font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; font-weight: 800; }
        .detail-info p { font-size: 1.6rem; font-weight: 900; }

        .sun-path-container { position: relative; height: 120px; margin-top: 20px; border-bottom: 2px solid var(--glass-border); }
        .sun-arc { position: absolute; bottom: 0; left: 10%; width: 80%; height: 100px; border-top: 2px dashed var(--accent-cyan); border-radius: 100px 100px 0 0; }
        .sun-icon { position: absolute; color: #ffd700; transform: translate(-50%, 50%); text-shadow: 0 0 15px #ffd700; transition: all 1s; }
        .sun-times { display: flex; justify-content: space-between; margin-top: 10px; font-weight: 800; }

        /* Loader */
        .loader { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--glass-bg); backdrop-filter: blur(30px); z-index: 1000; border-radius: inherit; display: none; align-items: center; justify-content: center; flex-direction: column; color: var(--accent-cyan); font-weight: 900; font-size: 1.5rem; text-align: center; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.3); border-top-color: var(--accent-cyan); border-radius: 50%; animation: spin 1s infinite linear; margin-bottom: 20px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>
<body data-theme="aero">

    <!-- Procedural Immersive Canvas -->
    <canvas id="bgCanvas"></canvas>

    <div class="app-container">
        
        <!-- Header -->
        <header class="header-bar">
            <h1 class="bruto-title"><i data-lucide="globe" style="color: var(--accent-cyan);"></i> A-sphereWeather</h1>
            
            <div class="search-wrapper">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Search cities..." autocomplete="off">
                <div id="autocompleteDropdown" class="autocomplete-dropdown"></div>
            </div>
        </header>

        <!-- Advanced Toolbar -->
        <div class="toolbar">
            <div class="toolbar-group">
                <div class="toolbar-label">Locations</div>
                <button class="glossy-btn preset-btn" data-lat="39.9042" data-lon="116.4074" data-name="Beijing">Beijing</button>
                <button class="glossy-btn preset-btn" data-lat="3.1390" data-lon="101.6869" data-name="Kuala Lumpur">KL</button>
                <button class="glossy-btn preset-btn" data-lat="50.8503" data-lon="4.3517" data-name="Brussels">Brussels</button>
            </div>
            
            <div class="toolbar-group">
                <div class="toolbar-label">Base Theme</div>
                <select id="themeSelect" class="glossy-btn">
                    <option value="aero">Aero Sky</option>
                    <option value="astro">Astro Night</option>
                    <option value="solar">Solarpunk</option>
                    <option value="vapor">Sunset Vapor</option>
                    <option value="bruto">Brutal Mono</option>
                </select>
            </div>

            <div class="toolbar-group">
                <div class="toolbar-label"><i data-lucide="sparkles" size="14"></i> Immersive Toggles</div>
                <button id="togTime" class="glossy-btn toggle-btn"><i data-lucide="clock"></i> Time Sync</button>
                <button id="togWeather" class="glossy-btn toggle-btn"><i data-lucide="cloud-lightning"></i> Wx Sync</button>
                <button id="togBiome" class="glossy-btn toggle-btn"><i data-lucide="mountain"></i> Biome Sync</button>
            </div>
        </div>

        <!-- Dashboard -->
        <main class="widget-grid" id="dashboard">
            
            <!-- Hero Widget -->
            <div class="widget w-hero" draggable="true" style="order: 1;">
                <div id="mainLoader" class="loader"><div class="spinner"></div><span id="loaderText">Syncing Atmosphere...</span></div>
                <div>
                    <h2 id="heroCity" class="hero-city glow-text">...</h2>
                    <div class="hero-cond">
                        <i id="heroIcon" data-lucide="cloud" size="32"></i> 
                        <span id="heroDesc">Loading Data</span>
                    </div>
                    <div id="heroHL" class="hero-hl">H:--° L:--°</div>
                </div>
                <div id="heroTemp" class="hero-temp">--°</div>
            </div>

            <!-- Hourly Widget -->
            <div class="widget w-hourly" draggable="true" style="order: 2;">
                <h3 class="w-title"><i data-lucide="clock"></i> 24-Hour Forecast</h3>
                <div class="hourly-scroll" id="hourlyContainer"></div>
            </div>

            <!-- Details Widget -->
            <div class="widget w-details" draggable="true" style="order: 3;">
                <h3 class="w-title" style="grid-column: 1 / -1;"><i data-lucide="activity"></i> Atmospheric Conditions</h3>
                <div class="detail-box"><i data-lucide="wind" size="32" class="detail-icon"></i><div class="detail-info"><h4>Wind</h4><p id="detWind">--</p></div></div>
                <div class="detail-box"><i data-lucide="droplets" size="32" class="detail-icon"></i><div class="detail-info"><h4>Humidity</h4><p id="detHum">--</p></div></div>
                <div class="detail-box"><i data-lucide="sun" size="32" class="detail-icon"></i><div class="detail-info"><h4>UV Index</h4><p id="detUV">--</p></div></div>
                <div class="detail-box"><i data-lucide="eye" size="32" class="detail-icon"></i><div class="detail-info"><h4>Visibility</h4><p id="detVis">--</p></div></div>
            </div>

            <!-- Sun/Moon Widget -->
            <div class="widget w-sun" draggable="true" style="order: 4;">
                <h3 class="w-title"><i data-lucide="sunset"></i> Solar Cycle</h3>
                <div class="sun-path-container">
                    <div class="sun-arc"></div>
                    <i id="sunPosIcon" data-lucide="sun" size="24" class="sun-icon" style="left: 50%; bottom: 100%;"></i>
                </div>
                <div class="sun-times"><span id="sunRise">--:--</span><span id="sunSet">--:--</span></div>
            </div>

            <!-- Daily Widget -->
            <div class="widget w-daily" draggable="true" style="order: 5;">
                <h3 class="w-title"><i data-lucide="calendar"></i> 7-Day Outlook</h3>
                <div class="daily-list" id="dailyContainer"></div>
            </div>

        </main>
    </div>

    <script>
        // Use a strict wrapper to guarantee the DOM is ready before any logic runs
        document.addEventListener('DOMContentLoaded', () => {
            
            // 1. Initialize Icons Safely
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }

            // =========================================
            // STATE & IMMERSIVE TRACKING
            // =========================================
            let envState = {
                theme: 'aero',
                immTime: false,
                immWeather: false,
                immBiome: false,
                currentLat: 50.8503, // Default Brussels
                currentHour: 12,
                weatherCode: 0,
                isStorm: false
            };

            // Setup Event Listeners for UI
            const themeSelect = document.getElementById('themeSelect');
            themeSelect.addEventListener('change', (e) => {
                envState.theme = e.target.value;
                applyThemes();
            });

            function toggleMode(btnId, stateKey) {
                const btn = document.getElementById(btnId);
                btn.addEventListener('click', () => {
                    envState[stateKey] = !envState[stateKey];
                    btn.classList.toggle('active', envState[stateKey]);
                    applyThemes();
                    resetParticles(); 
                });
            }

            toggleMode('togTime', 'immTime');
            toggleMode('togWeather', 'immWeather');
            toggleMode('togBiome', 'immBiome');

            // Drag & Drop Functionality
            const widgets = document.querySelectorAll('.widget');
            let draggedWidget = null;
            widgets.forEach(w => {
                w.addEventListener('dragstart', function(e) { 
                    draggedWidget = this; 
                    setTimeout(() => this.classList.add('dragging'), 0); 
                });
                w.addEventListener('dragend', function() { 
                    this.classList.remove('dragging'); 
                    draggedWidget = null; 
                });
                w.addEventListener('dragover', function(e) { 
                    e.preventDefault(); 
                    if (this !== draggedWidget) this.classList.add('drag-over'); 
                });
                w.addEventListener('dragleave', function() { 
                    this.classList.remove('drag-over'); 
                });
                w.addEventListener('drop', function(e) {
                    e.preventDefault(); 
                    this.classList.remove('drag-over');
                    if (this !== draggedWidget) {
                        let cur = this.style.order; 
                        this.style.order = draggedWidget.style.order; 
                        draggedWidget.style.order = cur;
                    }
                });
            });

            // Prevent drag conflict when scrolling hourly container
            const hCont = document.getElementById('hourlyContainer');
            if(hCont) {
                hCont.addEventListener('mousedown', e => e.stopPropagation());
                hCont.addEventListener('touchstart', e => e.stopPropagation(), {passive: true});
            }

            // =========================================
            // PROCEDURAL CANVAS ENGINE
            // =========================================
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');
            let width, height, particles = [], mouseX = 0, mouseY = 0;

            function resize() { 
                width = canvas.width = window.innerWidth; 
                height = canvas.height = window.innerHeight; 
                resetParticles(); 
            }
            window.addEventListener('resize', resize);
            window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

            class Particle {
                constructor() { this.init(); }
                init() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.opacity = Math.random() * 0.5 + 0.1;
                    
                    // Biome Sync Logic
                    if (envState.immBiome) {
                        const absLat = Math.abs(envState.currentLat);
                        if (absLat < 20) this.hue = Math.random() * 60 + 90; // Rainforest: Greens
                        else if (absLat < 40) this.hue = Math.random() * 40 + 30; // Desert: Oranges
                        else if (absLat > 60) this.hue = Math.random() * 20 + 180; // Tundra: Ice Blues
                        else this.hue = Math.random() * 60 + 180; // Temperate
                    } else {
                        this.hue = Math.random() * 60 + 180; // Default
                    }

                    // Weather Sync Logic
                    if (envState.immWeather) {
                        if (envState.weatherCode >= 50 && envState.weatherCode <= 67) {
                            this.type = 'rain';
                            this.size = Math.random() * 2 + 1;
                            this.speedY = Math.random() * 15 + 10;
                            this.speedX = Math.random() * 2 - 1;
                        } else if (envState.weatherCode >= 71 && envState.weatherCode <= 77) {
                            this.type = 'snow';
                            this.size = Math.random() * 4 + 2;
                            this.speedY = Math.random() * 2 + 1;
                            this.speedX = Math.random() * 2 - 1;
                            this.hue = 0; // White
                        } else {
                            this.type = 'bubble';
                            this.size = Math.random() * 100 + 20;
                            this.speedY = - (Math.random() * 0.5 + 0.1);
                            this.speedX = (Math.random() - 0.5) * 0.5;
                        }
                    } else {
                        this.type = 'bubble';
                        this.size = Math.random() * 100 + 20;
                        this.speedY = - (Math.random() * 0.5 + 0.1);
                        this.speedX = (Math.random() - 0.5) * 0.5;
                    }
                }
                update() {
                    this.y += this.speedY; 
                    this.x += this.speedX;
                    
                    if (this.type === 'snow') this.x += Math.sin(this.y * 0.05) * 0.5;

                    if (this.type === 'bubble') {
                        this.x -= (mouseX - width/2) * 0.005 * (this.size * 0.01);
                        this.y -= (mouseY - height/2) * 0.005 * (this.size * 0.01);
                    }

                    if (this.y < -this.size && this.speedY < 0) this.y = height + this.size;
                    if (this.y > height + this.size && this.speedY > 0) this.y = -this.size;
                    if (this.x < -this.size) this.x = width + this.size;
                    if (this.x > width + this.size) this.x = -this.size;
                }
                draw() {
                    ctx.beginPath();
                    if (this.type === 'rain') {
                        ctx.moveTo(this.x, this.y);
                        ctx.lineTo(this.x - this.speedX, this.y - this.speedY);
                        ctx.strokeStyle = `hsla(${this.hue}, 80%, 80%, ${this.opacity})`;
                        ctx.lineWidth = this.size;
                        ctx.stroke();
                    } else if (this.type === 'snow') {
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
                        ctx.fill();
                    } else {
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        const grad = ctx.createRadialGradient(this.x - this.size*0.3, this.y - this.size*0.3, 0, this.x, this.y, this.size);
                        grad.addColorStop(0, `hsla(${this.hue}, 80%, 95%, ${this.opacity})`);
                        grad.addColorStop(1, `hsla(${this.hue}, 80%, 70%, 0)`);
                        ctx.fillStyle = grad;
                        ctx.fill();
                    }
                }
            }

            function resetParticles() {
                particles = [];
                const count = (envState.immWeather && envState.weatherCode >= 50) ? 150 : 35; 
                for (let i = 0; i < count; i++) particles.push(new Particle());
            }

            function getGradientColors() {
                if (envState.immTime) {
                    const h = envState.currentHour;
                    if (h >= 5 && h < 8) return ['#ff9a9e', '#fecfef']; // Dawn
                    if (h >= 8 && h < 17) return ['#74ebd5', '#9face6']; // Day
                    if (h >= 17 && h < 19) return ['#ff7e5f', '#feb47b']; // Dusk
                    return ['#020024', '#090979']; // Night
                }
                const rs = getComputedStyle(document.documentElement);
                return [
                    rs.getPropertyValue('--bg-grad-1').trim() || '#74ebd5', 
                    rs.getPropertyValue('--bg-grad-2').trim() || '#9face6'
                ];
            }

            function animateCanvas() {
                const colors = getGradientColors();
                const grad = ctx.createLinearGradient(0, 0, width, height);
                grad.addColorStop(0, colors[0]);
                grad.addColorStop(1, colors[1]);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                particles.forEach(p => { p.update(); p.draw(); });

                // Storm lightning
                if (envState.immWeather && envState.isStorm && Math.random() < 0.01) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.fillRect(0, 0, width, height);
                }

                requestAnimationFrame(animateCanvas);
            }
            resize();
            animateCanvas();

            function applyThemes() {
                document.documentElement.setAttribute('data-theme', envState.theme);
                document.body.className = ''; // Reset
                if (envState.immBiome) {
                    const absLat = Math.abs(envState.currentLat);
                    if (absLat < 20) document.body.classList.add('biome-rainforest');
                    else if (absLat < 40) document.body.classList.add('biome-desert');
                    else if (absLat > 60) document.body.classList.add('biome-tundra');
                }
            }


            // =========================================
            // WEATHER API & DATA BINDING
            // =========================================
            const wmoCodes = {
                0: { desc: "Clear Sky", icon: "sun" }, 1: { desc: "Mainly Clear", icon: "sun-dim" },
                2: { desc: "Partly Cloudy", icon: "cloud-sun" }, 3: { desc: "Overcast", icon: "cloud" },
                45: { desc: "Foggy", icon: "cloud-fog" }, 51: { desc: "Light Drizzle", icon: "cloud-drizzle" },
                61: { desc: "Light Rain", icon: "cloud-rain" }, 63: { desc: "Rain", icon: "cloud-rain" },
                65: { desc: "Heavy Rain", icon: "cloud-lightning" }, 71: { desc: "Light Snow", icon: "snowflake" },
                73: { desc: "Snow", icon: "snowflake" }, 95: { desc: "Storm", icon: "cloud-lightning" }
            };
            const getWmo = (code) => wmoCodes[code] || { desc: "Unknown", icon: "cloud" };

            function showLoader(text) {
                const loader = document.getElementById('mainLoader');
                document.getElementById('loaderText').innerText = text;
                loader.style.display = 'flex';
            }

            async function fetchWeather(lat, lon, cityName) {
                showLoader("Syncing Atmosphere...");
                document.getElementById('autocompleteDropdown').style.display = 'none';
                document.getElementById('searchInput').value = '';

                try {
                    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,surface_pressure,visibility&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max&timezone=auto`;
                    const response = await fetch(url);
                    if (!response.ok) throw new Error("API Network Error");
                    
                    const data = await response.json();
                    if (!data || !data.current || !data.daily) throw new Error("Invalid API Data");
                    
                    // Update Global State safely
                    envState.currentLat = lat;
                    envState.weatherCode = data.current.weather_code;
                    envState.isStorm = data.current.weather_code >= 95;
                    envState.currentHour = new Date(data.current.time).getHours();

                    updateUI(cityName, data);
                    applyThemes(); 
                    resetParticles(); 

                } catch (error) {
                    console.error("Fetch error:", error);
                    document.getElementById('heroCity').innerText = "Data Error";
                    document.getElementById('heroDesc').innerText = "Unable to sync";
                } finally {
                    setTimeout(() => document.getElementById('mainLoader').style.display = 'none', 500);
                }
            }

            function updateUI(cityName, data) {
                const cur = data.current, daily = data.daily, hourly = data.hourly;
                const det = getWmo(cur.weather_code);

                // Hero
                document.getElementById('heroCity').innerText = cityName;
                document.getElementById('heroTemp').innerText = Math.round(cur.temperature_2m) + '°';
                document.getElementById('heroDesc').innerText = det.desc;
                document.getElementById('heroIcon').setAttribute('data-lucide', det.icon);
                
                const maxT = daily.temperature_2m_max && daily.temperature_2m_max[0] !== undefined ? Math.round(daily.temperature_2m_max[0]) : '--';
                const minT = daily.temperature_2m_min && daily.temperature_2m_min[0] !== undefined ? Math.round(daily.temperature_2m_min[0]) : '--';
                document.getElementById('heroHL').innerText = `H:${maxT}°  L:${minT}°`;

                // Details
                document.getElementById('detWind').innerText = cur.wind_speed_10m + ' km/h';
                document.getElementById('detHum').innerText = cur.relative_humidity_2m + '%';
                document.getElementById('detUV').innerText = daily.uv_index_max && daily.uv_index_max[0] ? Math.round(daily.uv_index_max[0]) : '--';
                document.getElementById('detVis').innerText = cur.visibility ? (cur.visibility / 1000).toFixed(1) + ' km' : '--';

                // Hourly
                const hCont = document.getElementById('hourlyContainer'); 
                hCont.innerHTML = '';
                if (hourly && hourly.time) {
                    let sIdx = 0;
                    for(let i=0; i<hourly.time.length; i++) {
                        if(new Date(hourly.time[i]).getHours() === envState.currentHour) { sIdx = i; break; }
                    }
                    for (let i = sIdx; i < sIdx + 24 && i < hourly.time.length; i++) {
                        const time = new Date(hourly.time[i]);
                        const hDet = getWmo(hourly.weather_code[i]);
                        hCont.innerHTML += `<div class="hour-pill"><span class="hour-time">${i===sIdx?'Now':time.toLocaleTimeString([],{hour:'2-digit'})}</span><i data-lucide="${hDet.icon}" size="24"></i><span class="hour-temp">${Math.round(hourly.temperature_2m[i])}°</span></div>`;
                    }
                }

                // Daily
                const dCont = document.getElementById('dailyContainer'); 
                dCont.innerHTML = '';
                if (daily && daily.time) {
                    const wMin = Math.min(...daily.temperature_2m_min.filter(t => t !== null));
                    const wMax = Math.max(...daily.temperature_2m_max.filter(t => t !== null));
                    const range = (wMax - wMin) || 1; // Prevent division by zero
                    
                    for (let i = 0; i < 7 && i < daily.time.length; i++) {
                        if(daily.temperature_2m_min[i] === null) continue;
                        const minDayT = Math.round(daily.temperature_2m_min[i]);
                        const maxDayT = Math.round(daily.temperature_2m_max[i]);
                        const lPct = ((minDayT - wMin)/range)*100;
                        const wPct = ((maxDayT - minDayT)/range)*100;
                        
                        dCont.innerHTML += `<div class="daily-item"><span class="daily-day">${i===0?'Today':new Date(daily.time[i]).toLocaleDateString([],{weekday:'short'})}</span><i data-lucide="${getWmo(daily.weather_code[i]).icon}" size="20"></i><div class="daily-bar"><div class="daily-bar-fill" style="left:${lPct}%;width:${Math.max(wPct,5)}%;"></div></div><span class="daily-temps">${minDayT}°/${maxDayT}°</span></div>`;
                    }
                }

                // Sun
                if (daily.sunrise && daily.sunset) {
                    const rise = new Date(daily.sunrise[0]), set = new Date(daily.sunset[0]), now = new Date();
                    document.getElementById('sunRise').innerText = rise.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                    document.getElementById('sunSet').innerText = set.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                    
                    const sunIcon = document.getElementById('sunPosIcon');
                    if (now < rise || now > set) {
                        sunIcon.setAttribute('data-lucide', 'moon'); 
                        sunIcon.style.left = '50%'; 
                        sunIcon.style.bottom = '10px'; 
                        sunIcon.style.color = '#fff';
                    } else {
                        sunIcon.setAttribute('data-lucide', 'sun'); 
                        sunIcon.style.color = '#ffd700';
                        let pct = Math.max(0, Math.min(100, ((now - rise) / (set - rise)) * 100));
                        if(isNaN(pct)) pct = 0;
                        sunIcon.style.left = `calc(10% + (80% * ${pct / 100}))`;
                        sunIcon.style.bottom = `${Math.sin((pct / 100) * Math.PI) * 100}%`;
                    }
                }

                if (typeof lucide !== 'undefined') lucide.createIcons();
            }

            // =========================================
            // SEARCH & GEOCODING
            // =========================================
            const searchInput = document.getElementById('searchInput');
            const dropdown = document.getElementById('autocompleteDropdown');
            let searchTimeout;

            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                const query = e.target.value.trim();
                if (query.length < 2) { dropdown.style.display = 'none'; return; }
                
                searchTimeout = setTimeout(async () => {
                    try {
                        const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${query}&count=5&language=en&format=json`);
                        if (!res.ok) throw new Error("Geocoding API Error");
                        const data = await res.json();
                        
                        if (data.results && data.results.length > 0) {
                            dropdown.innerHTML = '';
                            data.results.forEach(city => {
                                const div = document.createElement('div'); 
                                div.className = 'autocomplete-item';
                                div.innerText = `${city.name}${city.country ? ', '+city.country : ''}`;
                                div.onclick = () => fetchWeather(city.latitude, city.longitude, city.name);
                                dropdown.appendChild(div);
                            });
                            dropdown.style.display = 'flex';
                        } else {
                            dropdown.style.display = 'none';
                        }
                    } catch (e) { 
                        console.error("Geocoding failed:", e); 
                    }
                }, 400); // 400ms debounce
            });

            // Close dropdown when clicking outside
            document.addEventListener('click', (e) => { 
                if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.style.display = 'none'; 
                }
            });

            // Init Preset Buttons
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.addEventListener('click', () => fetchWeather(btn.dataset.lat, btn.dataset.lon, btn.dataset.name));
            });

            // =========================================
            // BOOTSTRAP INITIALIZATION
            // =========================================
            applyThemes();
            fetchWeather(50.8503, 4.3517, "Brussels"); // Startup with Brussels

        }); // End DOMContentLoaded
    </script>
</body>
</html>
